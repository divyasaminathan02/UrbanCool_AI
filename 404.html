<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanCool AI — Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirect deep paths to HashRouter
      const pathname = window.location.pathname;
      const repoName = pathname.split('/')[1] || '';
      const target = window.location.origin + '/' + repoName + '/#' + pathname.replace('/' + repoName, '');
      window.location.replace(target);
    </script>
  </head>
  <body style="font-family: sans-serif; background: #0b1320; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2>UrbanCool AI</h2>
      <p>Redirecting to Command Center...</p>
    </div>
  </body>
</html>
